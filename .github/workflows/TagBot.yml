name: TagBot

# Creates the git tag and the GitHub release after the General registry
# merges a registration of this package. Registrator comments on the
# registration request, which triggers this workflow. The release starts the
# Documentation workflow (versioned docs) and the Zenodo archive.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      lookback:
        default: "3"

permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # A tag pushed with GITHUB_TOKEN does not start other workflows, so
          # the tag is pushed with the deploy key, which also lets the tag
          # build the versioned documentation.
          ssh: ${{ secrets.DOCUMENTER_KEY }}
